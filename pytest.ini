[pytest]
testpaths = test_cases tests
pythonpath = src
addopts = -ra --strict-markers --tb=short --order-scope=session
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
markers =
    smoke: basic launch/session tests
    sample: sample tests that require app-specific locators
    order(index): enforce test execution order
    xdist_group(name): group tests by device when running with pytest-xdist
